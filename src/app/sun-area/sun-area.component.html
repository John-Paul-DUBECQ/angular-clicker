<div class="sun-area-wrapper" *ngIf="sunUnlocked" [class.sun-area-wrapper--mobile]="mobileLayout" [style.--sun-orbit-duration]="15 * sunSpeedFactor" [style.--sun-size.px]="44 * sunSizeFactor">
  <div class="sun-orbit-track" (click)="clickSun($event)">
    <div class="sun" [title]="'Clic x' + (sunDamageMultiplier || 2)"></div>
  </div>
</div>
